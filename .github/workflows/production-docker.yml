name: Production-Docker

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Enter deployment email"
        required: true
        type: string
      resource_group:
        description: "Azure Resource Group Name (optional, defaults to AZURE_RESOURCE_GROUP secret)"
        required: false
        type: string
      container_app_name:
        description: "Azure Container App Name (optional, defaults to 'planner')"
        required: false
        type: string

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Verify email from input
        id: verify-email
        run: |
          INPUT_EMAIL="${{ github.event.inputs.email }}"
          AUTHORIZED_EMAIL="${{ secrets.DEPLOYMENT_EMAIL }}"

          echo "Input email: $INPUT_EMAIL"
          echo "Authorized email from secrets: $AUTHORIZED_EMAIL"

          if [ -z "$AUTHORIZED_EMAIL" ]; then
            echo "DEPLOYMENT_EMAIL secret is not set in repository secrets."
            exit 1
          fi

          if [ "$INPUT_EMAIL" = "$AUTHORIZED_EMAIL" ]; then
            echo "Email verification passed"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "Email verification failed. Input email does not match authorized email."
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push binary
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            vickystardust5/planner:latest
            vickystardust5/planner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        id: deploy-azure
        run: |
          RESOURCE_GROUP="${{ inputs.resource_group || secrets.AZURE_RESOURCE_GROUP }}"
          APP_NAME="${{ inputs.container_app_name || secrets.AZURE_CONTAINER_APP_NAME || 'planner' }}"

          echo "Deploying image vickystardust5/planner:${{ github.sha }} to Azure Container App '$APP_NAME' in Resource Group '$RESOURCE_GROUP'..."

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "vickystardust5/planner:${{ github.sha }}"

          APP_FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "app_url=https://$APP_FQDN" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "## Deployment Successful 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: \`vickystardust5/planner:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Application URL**: ${{ steps.deploy-azure.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
